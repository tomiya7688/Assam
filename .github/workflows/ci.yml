name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Check formatting of changed Python files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed=$(git diff --name-only --diff-filter=ACMR "$base...$head" -- '*.py')
          else
            before="${{ github.event.before }}"
            git cat-file -e "$before^{commit}"
            changed=$(git diff --name-only --diff-filter=ACMR "$before" HEAD -- '*.py')
          fi
          if [ -n "$changed" ]; then
            mapfile -t files <<< "$changed"
            python -m ruff format --check "${files[@]}"
          fi
      - run: python -m pytest -q
      - name: Check shipped target mappings
        run: |
          for t in riscv64-rv64i-draft x86-64-draft arm64-a64-draft; do
            python -m assam.cli check-target-mappings "examples/targets/$t.mapping.json" --coverage "examples/targets/$t.coverage.json"
          done
          python -m assam.cli check-target-matrix \
            examples/targets/x86-64-draft.coverage.json \
            examples/targets/arm64-a64-draft.coverage.json \
            examples/targets/riscv64-rv64i-draft.coverage.json \
            --mapping examples/targets/x86-64-draft.mapping.json \
            --mapping examples/targets/arm64-a64-draft.mapping.json \
            --mapping examples/targets/riscv64-rv64i-draft.mapping.json
