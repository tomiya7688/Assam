name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Bootstrap from the hash-pinned wheel recommended in the Python security notice.
      - name: Install verified pip bootstrap
        run: >-
          python -m pip install --no-deps --force-reinstall
          'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
      - run: python -m pip install -e ".[dev]"
      - name: Check formatting of changed Python files
        shell: bash
        run: |
          names_file="${RUNNER_TEMP}/changed-python-files.z"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git diff -z --name-only --diff-filter=ACMR "$base...$head" -- '*.py' > "$names_file"
          else
            before="${{ github.event.before }}"
            if ! git cat-file -e "$before^{commit}"; then
              echo "::error::Push baseline commit is unavailable; cannot verify changed Python files."
              exit 1
            fi
            git diff -z --name-only --diff-filter=ACMR "$before" HEAD -- '*.py' > "$names_file"
          fi
          mapfile -d '' -t files < "$names_file"
          if ((${#files[@]})); then
            python -m ruff format --check -- "${files[@]}"
          fi
      - run: python -m pytest -q
      - name: Check shipped target mappings
        run: |
          for t in riscv64-rv64i-draft x86-64-draft arm64-a64-draft; do
            python -m assam.cli check-target-mappings "examples/targets/$t.mapping.json" --coverage "examples/targets/$t.coverage.json"
          done
          python -m assam.cli check-target-matrix \
            examples/targets/x86-64-draft.coverage.json \
            examples/targets/arm64-a64-draft.coverage.json \
            examples/targets/riscv64-rv64i-draft.coverage.json \
            --mapping examples/targets/x86-64-draft.mapping.json \
            --mapping examples/targets/arm64-a64-draft.mapping.json \
            --mapping examples/targets/riscv64-rv64i-draft.mapping.json
