name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - name: Check shipped target mappings
        run: |
          for t in riscv64-rv64i-draft x86-64-draft; do
            python -m assam.cli check-target-mappings "examples/targets/$t.mapping.json" --coverage "examples/targets/$t.coverage.json"
          done
