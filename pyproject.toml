[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "assam"
version = "0.1.0"
description = "Assembly Abstract Machine reference implementation"
requires-python = ">=3.10"
[project.scripts]
assam = "assam.cli:main"
[tool.pytest.ini_options]
pythonpath = ["."]